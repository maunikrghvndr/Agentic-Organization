# Library lint on every push and pull request. Zero agent tokens: this only runs the two PowerShell lints and the library's own tests.
# This file is agent configuration (reviewed as code; security pass before merge). Keep permissions read-only.
name: lint-library

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Lint the library
        shell: pwsh
        run: ./Scripts/Lint-Library.ps1
      - name: Lint the library's own repo memory
        shell: pwsh
        run: ./Scripts/Lint-RepoMemory.ps1 -RepoRoot .
      - name: Lint positive controls
        shell: pwsh
        run: |
          ./Scripts/tests/Lint-Library.Tests.ps1
          ./Scripts/tests/Sync-AgentsMd.Tests.ps1
      - name: Node tests (hooks, release-audit validator, skills installer)
        run: |
          node --test "Hooks/*.test.mjs"
          node --test Scripts/validate-release-audit.test.mjs
          node --test "Skills/*.test.mjs"
          node Workflows/review-loop.test.mjs Workflows/review-loop.js
